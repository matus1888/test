name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Bot — тесты и lint (Go)
        run: |
          cd bot
          go vet ./...
          go test ./...
      - name: Bot — сборка бинарников win/linux
        run: |
          cd bot
          mkdir -p ../public/bot
          GOOS=linux   GOARCH=amd64 go build -o ../public/bot/bybitbot-linux-amd64    ./cmd/bybitbot
          GOOS=linux   GOARCH=arm64 go build -o ../public/bot/bybitbot-linux-arm64    ./cmd/bybitbot
          GOOS=windows GOARCH=amd64 go build -o ../public/bot/bybitbot-windows-amd64.exe ./cmd/bybitbot
      - run: bun install --frozen-lockfile
      - run: bun run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4