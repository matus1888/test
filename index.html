<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Скринер Bybit</title>
    <meta
      name="description"
      content="Скринер Bybit: ранжирование монет по качеству входа, торговый план по символу, бумажный и реальный портфель. Работает как приложение (PWA)."
    />
    <!-- PWA: манифест, иконки и цвета системного интерфейса. Пути относительные:
         на GitHub Pages проект живёт в /<repo>/, абсолютный '/manifest...' дал бы 404. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#0b0d10" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Скринер" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
